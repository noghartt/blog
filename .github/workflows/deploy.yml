name: Deploy to GitHub Pages

# Builds the site with garden (engine/, Rust) and publishes engine/dist.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the engine's build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build garden
        run: cargo build --release --locked --manifest-path engine/Cargo.toml

      # The daily workflow updates src/content/bookmarks/bookmarks.json; bring those
      # bookmarks into the links database before building (offline, nothing fetched).
      - name: Import bookmarks
        run: ./engine/target/release/garden links import-reader-json

      - name: Build the site
        run: ./engine/target/release/garden build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: engine/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
